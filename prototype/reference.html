/* v1.3 */

/* Drag grip only appears on hover */

/* Embedded Claim editor */

/* ===== v1.5 interaction refinements ===== */
.singlePropHead{
  position:relative;
  transition:background .14s ease, opacity .14s ease, box-shadow .14s ease;
}
.singlePropHead:hover{
  background:rgba(94,108,101,.07);
}
.colHoverCell{
  background:rgba(94,108,101,.035)!important;
}
.dragColumnSource{
  opacity:.32!important;
}
.dragTargetBefore::before,
.dragTargetAfter::after{
  content:"";
  position:absolute;
  top:3px;bottom:3px;
  width:2px;
  border-radius:999px;
  background:currentColor;
  opacity:.55;
}
.dragTargetBefore::before{left:0}
.dragTargetAfter::after{right:0}
.columnGhost{
  position:fixed;
  left:-9999px;top:-9999px;
  width:150px;
  padding:9px 10px;
  border-radius:10px;
  background:rgba(252,252,249,.95);
  border:1px solid rgba(42,47,44,.10);

}

.claimEditor{display:grid;gap:3px}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fuzzyScore(q,obj){
 const query=(q||'').trim().toLowerCase(),name=obj.name.toLowerCase(),aliases=(obj.aliases||[]).map(x=>x.toLowerCase());
 let s=0;
 if(!query)s=70; else if(name===query)s=100; else if(name.startsWith(query))s=92; else if(aliases.some(a=>a===query))s=88; else if(name.includes(query))s=82; else if(aliases.some(a=>a.includes(query)||query.includes(a)))s=74; else {let hit=0,idx=0;for(const ch of query){const n=name.indexOf(ch,idx);if(n>=0){hit++;idx=n+1}}s=query.length?Math.round(hit/query.length*55):0}
 if(obj.deprecated)s-=45;
 return s;
}
function objectPickerResults(q){return [...allObjects].map(o=>({...o,score:fuzzyScore(q,o)})).filter(o=>o.score>5).sort((a,b)=>b.score-a.score||Number(a.deprecated)-Number(b.deprecated)||a.name.localeCompare(b.name,'zh-CN'))}
function createOptions(q){const name=(q||'').trim();return name?[{role:'原料',name},{role:'设备',name},{role:'过程',name}]:[]}

function btn(label,action,cls='ghost'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast=null;render()},1400)}
function navForPage(p){return p.type==='list'?p.nav:(p.type==='sample'||p.type==='batch-samples')?'samples':p.type==='analysis'?'analysis':p.type==='data-detail'?'data':p.type==='claim-detail'?'claims':'resources'}
function pageLabel(p){
 if(!p)return '';
 if(p.type==='list')return {samples:'样品',analysis:'分析',data:'数据',claims:'论点',resources:'资源'}[p.nav]||'返回';
 if(p.type==='sample')return p.id;
 if(p.type==='batch-samples')return '批量新建';
 if(p.type==='analysis')return '分析';
 if(p.type==='data-detail')return '数据';
 if(p.type==='claim-detail')return '论点';
 return '资源';
}

function goPage(page,nav,push=true){

}
function goBack(fallbackNav){

 else if(act==='confirm-unit'){state.modal=null;toast('单位已添加')}
 else if(act.startsWith('insert-ref-')){state.modal=null;render();toast('已插入引用（原型）')}
 else if(act==='open-search-sample'){goPage({type:'sample',id:'S260909-01'},'samples')}
 else if(act==='open-search-analysis'){goPage({type:'analysis',id:'A-260909-01'},'analysis')}
 else if(act==='open-search-data'){goPage({type:'data-detail',id:'D-260909-08'},'data')}
 else if(act==='open-search-claim'){goPage({type:'claim-detail',id:'C-260909-03'},'claims')}
 else if(act==='open-search-resource'){goPage({type:'resource-detail',kind:'原料',id:'m-hpmc'},'resources')}
 else if(act==='duplicate-sample'){
   const currentId=state.page.type==='sample'?state.page.id:'S260909-01';
   state.popover=null;
   goPage({type:'sample',id:'S260910-01',fresh:false,copiedFrom:currentId},'samples');
   toast('已复制当前样品并新建');
 }
 else if(act==='open-batch-samples'){
   state.popover=null;
   const currentId=state.page.type==='sample'?state.page.id:'S260909-01';
   goPage({type:'batch-samples',sourceId:currentId},'samples');
 }
 else if(act==='batch-create-all'){
   goPage({type:'sample',id:'S260910-02',fresh:true},'samples');
   toast('已创建 3 个样品，当前打开第一个');
 }
 else if(act==='batch-cancel'){goBack('samples')}
 else if(act==='add-batch-row'){toast('已添加一行（原型）')}
 else if(act==='delete-batch-row'){toast('已删除该行（原型）')}
 else if(['export-sample','duplicate-analysis','template-analysis','copy-data-ref','source-data','copy-claim-ref','mark-supported','mark-refuted','copy-resource-ref','resource-usage'].includes(act)){state.popover=null;toast('操作已执行（原型）')}
 else if(['delete-sample','delete-analysis','delete-data','delete-claim','delete-resource'].includes(act)){state.popover=null;toast('已移至回收站（原型）')}
 else if(act==='analysis-filter'){state.modal='filter';render()}
 else if(act==='clear-inline-search'){state.searchText='';state.modal=null;render()}
});

document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.modal='search';render()}
 if(e.key==='Escape'&&(state.modal||state.drawer||state.popover)){state.modal=state.drawer=state.popover=null;render()}
});


let tooltipEl=null;
document.addEventListener('mouseover',e=>{
 const target=e.target.closest('[data-full-label]');
 if(!target)return;
 const text=target.dataset.fullLabel;
 if(!text)return;
 if(tooltipEl)tooltipEl.remove();
 tooltipEl=document.createElement('div');
 tooltipEl.className='hoverTooltip';tooltipEl.textContent=text;
 document.body.appendChild(tooltipEl);
 const r=target.getBoundingClientRect();
 tooltipEl.style.left=Math.min(window.innerWidth-tooltipEl.offsetWidth-8,Math.max(8,r.left+r.width/2-tooltipEl.offsetWidth/2))+'px';
 tooltipEl.style.top=Math.min(window.innerHeight-tooltipEl.offsetHeight-8,r.bottom+6)+'px';
});
document.addEventListener('mouseout',e=>{
 const target=e.target.closest('[data-full-label]');
 if(!target)return;
 const related=e.relatedTarget;
 if(related&&target.contains(related))return;
 if(tooltipEl){tooltipEl.remove();tooltipEl=null}
});

let dragColKey=null;
let dragGhost=null;

function clearColumnDragVisuals(){
 document.querySelectorAll('.dragColumnSource,.dragTargetBefore,.dragTargetAfter,.colHoverCell').forEach(el=>{
   el.classList.remove('dragColumnSource','dragTargetBefore','dragTargetAfter','colHoverCell');
 });
 if(dragGhost){dragGhost.remove();dragGhost=null}
}
function highlightColumn(key,on=true){
 document.querySelectorAll(`[data-col-key="${key}"],[data-col-cell="${key}"]`).forEach(el=>{
   el.classList.toggle('colHoverCell',on);
 });
}

document.addEventListener('mouseover',e=>{
 const th=e.target.closest('[data-col-key]');
 if(!th||dragColKey)return;
 highlightColumn(th.dataset.colKey,true);
});
document.addEventListener('mouseout',e=>{
 const th=e.target.closest('[data-col-key]');
 if(!th||dragColKey)return;
 const related=e.relatedTarget;
 if(related&&th.contains(related))return;
 highlightColumn(th.dataset.colKey,false);
});

document.addEventListener('dragstart',e=>{
 const th=e.target.closest('[data-col-key]');
 if(!th)return;
 dragColKey=th.dataset.colKey;

 clearColumnDragVisuals();
 document.querySelectorAll(`[data-col-key="${dragColKey}"],[data-col-cell="${dragColKey}"]`).forEach(el=>el.classList.add('dragColumnSource'));

 const cells=[...document.querySelectorAll(`[data-col-cell="${dragColKey}"]`)].slice(0,4);
 dragGhost=document.createElement('div');
 dragGhost.className='columnGhost';
 dragGhost.innerHTML=`<strong>${th.dataset.fullLabel||th.textContent.trim()}</strong>${cells.map(c=>`<span>${c.textContent.trim()}</span>`).join('')}`;
 document.body.appendChild(dragGhost);
 if(e.dataTransfer){
   e.dataTransfer.effectAllowed='move';
   e.dataTransfer.setDragImage(dragGhost,72,18);
   e.dataTransfer.setData('text/plain',dragColKey);
 }
});

document.addEventListener('dragover',e=>{
 const th=e.target.closest('[data-col-key]');
 if(!th||!dragColKey)return;
 e.preventDefault();
 document.querySelectorAll('.dragTargetBefore,.dragTargetAfter').forEach(x=>x.classList.remove('dragTargetBefore','dragTargetAfter'));
 const r=th.getBoundingClientRect();
 const before=e.clientX < r.left+r.width/2;
 th.classList.add(before?'dragTargetBefore':'dragTargetAfter');
 if(e.dataTransfer)e.dataTransfer.dropEffect='move';
});

document.addEventListener('drop',e=>{
 const th=e.target.closest('[data-col-key]');
 if(!th||!dragColKey){clearColumnDragVisuals();dragColKey=null;return}
 e.preventDefault();

 const target=th.dataset.colKey;
 const r=th.getBoundingClientRect();
 const before=e.clientX < r.left+r.width/2;

 if(target!==dragColKey){
   const arr=[...state.sampleColumnOrder];
   const from=arr.indexOf(dragColKey);
   let to=arr.indexOf(target);
   if(from>=0&&to>=0){
     arr.splice(from,1);
     to=arr.indexOf(target);
     arr.splice(before?to:to+1,0,dragColKey);
     state.sampleColumnOrder=arr;
   }
 }
 clearColumnDragVisuals();
 dragColKey=null;
 render();
 toast('列顺序已更新');
});

document.addEventListener('dragend',()=>{
 clearColumnDragVisuals();
 dragColKey=null;
});
render();
</script>
</body>
</html>
